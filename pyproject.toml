[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mclovin"
version = "0.1.0"
description = "BLE control library and CLI for Mictuning LED controllers"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["bleak>=3.0"]

[project.scripts]
mcli = "mclovin.cli:main"
